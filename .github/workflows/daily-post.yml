name: Daily Yoga Post

on:
  schedule:
    - cron: "30 1 * * *"    # 01:30 UTC = 7:00 AM IST daily
  workflow_dispatch:         # lets you run it manually to test

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Hindi font
        run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-core libfribidi0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python post_daily.py
        env:
          GROQ_API_KEY: ${{ secrets.G_API_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.TAI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
